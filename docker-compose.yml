services:
  # 1. बैकएंड सर्विस
  backend:
    build: ./backend
    container_name: my-grocery-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://host.docker.internal:27017/Grocery-app
      - JWT_SECRET=fsitcs
      - NODE_ENV=development
      - SELLER_EMAIL=admin@gmail.com
      - SELLER_PASSWORD=admin123
      - CLOUDINARY_CLOUD_NAME=dxg3kedhm
      - CLOUDINARY_API_KEY=169683363476461
      - CLOUDINARY_API_SECRET=oVqmIOxgDGZiPyP4w4MgpaLHjgM
    # 🎯 बैकएंड के अपलोड्स फोल्डर को सुरक्षित करने के लिए वॉल्यूम
    volumes:
      - grocery_uploads:/app/uploads

  # 2. फ्रंटएंड सर्विस
  frontend:
    build: ./client
    container_name: my-grocery-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

# 🎯 डॉकर को बताना कि ऊपर यूज़ किए गए वॉल्यूम्स को बैकग्राउंड में परमानेंटली बनाएं
volumes:
  grocery_uploads: